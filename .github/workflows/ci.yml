name: TaskFlow CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-quality:
    name: Backend Lint & Tests (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.3', '8.4']

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: taskflow_test
          POSTGRES_USER: taskflow
          POSTGRES_PASSWORD: secret_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, dom, fileinfo, pdo, pdo_pgsql, pgsql, zip
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ matrix.php-version }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            composer-${{ matrix.php-version }}-

      - name: Install Composer dependencies
        working-directory: ./backend
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Code Style Check (Pint)
        if: matrix.php-version == '8.4'
        working-directory: ./backend
        run: ./vendor/bin/pint --test

      - name: Run Backend Tests
        working-directory: ./backend
        env:
          APP_ENV: testing
          APP_KEY: base64:dEYwUkhwZXpKVFhRcG4yaFhSZUZUcG9wT1p5bFhHVEw=
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: taskflow_test
          DB_USERNAME: taskflow
          DB_PASSWORD: secret_password
        run: php artisan test

  frontend-quality:
    name: Frontend Type-Check & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install NPM dependencies
        working-directory: ./frontend
        run: npm ci

      - name: TypeScript Check & Vite Build
        working-directory: ./frontend
        run: npm run build
